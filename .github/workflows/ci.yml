name: CI

on:
  workflow_call:

jobs:
  drift-check:
    name: Vendored tree-sitter matches pinned ref
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout awsum-nvim
        uses: actions/checkout@v6
        with:
          path: awsum-nvim

      - name: Read pinned ref
        id: pin
        run: echo "ref=$(tr -d ' \n' < awsum-nvim/.tree-sitter-awsum-rev)" >> "$GITHUB_OUTPUT"

      - name: Checkout tree-sitter-awsum at pinned ref
        uses: actions/checkout@v6
        with:
          repository: awsum-lang/tree-sitter-awsum
          ref: ${{ steps.pin.outputs.ref }}
          path: tree-sitter-awsum

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Check drift
        working-directory: awsum-nvim
        run: just check

  build-parser:
    name: Build parser (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Build parser
        shell: bash
        run: nvim --headless --noplugin -c "set rtp+=." -c "lua require('awsum.build_parser').build()" -c "q"

      - name: Verify parser artifact exists
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            test -f parser/awsum.dll
          else
            test -f parser/awsum.so
          fi
