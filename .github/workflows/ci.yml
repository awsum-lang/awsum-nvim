name: CI

on:
  workflow_call:

jobs:
  drift-check:
    name: Vendored tree-sitter matches pinned ref
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout awsum-nvim
        uses: actions/checkout@v6
        with:
          path: awsum-nvim

      - name: Read pinned ref
        id: pin
        run: echo "ref=$(tr -d ' \n' < awsum-nvim/.tree-sitter-awsum-rev)" >> "$GITHUB_OUTPUT"

      - name: Checkout tree-sitter-awsum at pinned ref
        uses: actions/checkout@v6
        with:
          repository: awsum-lang/tree-sitter-awsum
          ref: ${{ steps.pin.outputs.ref }}
          path: tree-sitter-awsum

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Check drift
        working-directory: awsum-nvim
        run: just check

  build-parser:
    name: Build parser (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      # Wrap the Lua call in pcall + `cquit 1` so a build_parser failure
      # propagates to a non-zero nvim exit (headless nvim otherwise swallows
      # Lua errors and exits 0 because of the trailing `-c "q"`).
      - name: Build parser
        shell: bash
        run: |
          nvim --headless --noplugin \
            -c "set rtp+=." \
            -c "lua local ok, err = pcall(require('awsum.build_parser').build); if not ok then io.stderr:write(tostring(err)) vim.cmd('cquit 1') end" \
            -c "q"

      - name: Verify parser artifact exists
        shell: bash
        run: |
          set -e
          if [ "$RUNNER_OS" = "Windows" ]; then
            expected=parser/awsum.dll
          else
            expected=parser/awsum.so
          fi
          echo "Expected artifact: $expected"
          echo "Contents of parser/:"
          if [ -d parser ]; then
            ls -la parser
          else
            echo "(parser/ directory does not exist)"
          fi
          test -f "$expected"
